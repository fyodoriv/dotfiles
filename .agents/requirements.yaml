# Where dotfiles meets each new-project required area. check-setup.sh reads it;
# the monthly audit in /tooling-checkup re-checks every line. Contract:
# agentbrew skill-plugins/workflow/new-project/references/requirements-map.md
# Each map line lands in the PR that makes it true, with a comment saying why.
# e2e: tests/e2e/hermetic-install.sh runs the real install (real chezmoi,
# lifecycle scripts, doctor, zsh) in a sandboxed scratch HOME; the US01 cases
# are in dotfiles-install-e2e.bats, and the real commands of US02-US06, US08,
# and US10 run after it via hermetic-exec.sh in stories-e2e.bats (happy + error
# case each); US07 and US09 use unit bats (accepted push back).
# Every test in tests/e2e/ is named "USNN e2e: ..." (tests/user-stories.bats
# checks it), and make e2e runs exactly that folder.
map.e2e: tests/e2e/hermetic-install.sh tests/e2e/hermetic-exec.sh tests/e2e/dotfiles-install-e2e.bats tests/e2e/stories-e2e.bats
# Checkup: /tooling-checkup is the one checkup command; its monthly pass runs
# the doctor, the cached gate, the story e2e, the speed review, learnings, and
# open P0s (tests/tooling-checkup-skill.bats).
map.checkup: skills/tooling-checkup/SKILL.md tests/tooling-checkup-skill.bats
# Caching: bin/cached-run keys a step on HEAD, the tracked diff, and untracked
# file names and contents (gitignored files and environment variables are not
# in the key; steps read tracked inputs); bin/bats-affected selects mapped
# tests plus every bats file (subfolders included) that reads a changed file by
# repo path (through REPO_ROOT, DOTFILES_DIR, any variable the file assigns
# from $BATS_TEST_DIRNAME or $BATS_TEST_FILENAME, or a folder variable built
# from one of those), as written (./path, dir/path), or a changed tests/ helper
# or fixture by its relative path; the gate calls this checkout's
# ./bin/cached-run;
# tests/e2e/needs-e2e.sh triggers the e2e on the repo files the lifecycle
# scripts run (macos.sh, bin/...), data/, and any lib that its commands, the
# doctor modules it checks (git, shell, sync), the lifecycle scripts, or those
# run targets load; make
# test-force runs all, tests/plugin included.
# tests/cached-run.bats proves an edit to one tracked or untracked file re-runs.
map.caching: bin/cached-run bin/bats-affected tests/e2e/needs-e2e.sh tests/cached-run.bats tests/bats-affected.bats tests/install-e2e-guard.bats
# Docs: docs/README.md maps every doc to the question it answers;
# tests/docs-contract.bats fails on an unmapped doc, a broken map link, an
# AGENTS.md over 10000 bytes or out of section order, or README drift.
map.docs: docs/README.md tests/docs-contract.bats

# VISION.md (root, where it has always lived) has Problem, Non-goals, Success
# (dated numeric goals with pivots and exact commands), Kill criteria phrased
# per wrapper, and Prior art linking docs/competition/scorecard.md.
map.vision: VISION.md

# docs/metrics.md: every metric is an outcome with a goal, a pivot, and its
# exact command; missing data prints (stub). bin/dotfiles-metrics --table runs
# every command; tests/dotfiles-contribute-metrics.bats fails on a row with
# no command or a placeholder. The scorecard gives each benchmark metric a
# goal, pivot, and command. Gate speed joins the table with the gate timings.
map.metrics: docs/metrics.md docs/competition/scorecard.md bin/dotfiles-metrics tests/dotfiles-contribute-metrics.bats

# Setup: the README's first code block is one line that clones, runs
# bin/dotfiles-install (backup, apply, heal, verify, auto-restore), and ends
# with the doctor; tests/docs-contract.bats fails if it drifts. Optional steps
# (agentbrew, a failing doctor --fix) warn instead of failing
# (tests/dotfiles-install.bats). No scripts/setup.sh alias for a bin/ command,
# and setup may prompt when macOS requires it (accepted push back).
map.setup: README.md bin/dotfiles-install tests/docs-contract.bats tests/dotfiles-install.bats

# Each story has a Metric line naming a docs/metrics.md outcome row (test
# counts only after "Guard:") and a Tests line naming its test files; e2e tests
# are named "USNN e2e: ..." with a happy and an error case (stories-e2e.bats
# runs real commands after a real sandboxed install). US07 and US09 use unit
# bats (accepted push back). tests/user-stories.bats fails on any drift.
map.user-stories: docs/user-stories/README.md tests/e2e/stories-e2e.bats tests/user-stories.bats

# docs/observability.md has Logs (content-free JSONL stats, load samples,
# LaunchAgent logs), Errors (lib/errors-log.sh: allow-listed fields only, each
# event names its story, off in tests; no external reporter by accepted push
# back), and Health check: bin/dotfiles-doctor instead of scripts/doctor.sh
# (accepted push back: no scripts/ alias for a bin/ command); every failing
# line ends with its fix. tests/errors-log.bats enforces all of it.
map.observability: docs/observability.md lib/errors-log.sh bin/dotfiles-doctor tests/errors-log.bats
# Secrets: .gitignore ignores .env and .env.*; git-hooks/pre-commit scans every
# staged change for hardcoded secrets and private references; git-hooks/pre-push
# blocks private references and private emails before github.com. No .metrics/ entry: gate timings live under
# ~/.local/state/dotfiles, outside the repo (accepted push back).
map.secrets: .gitignore git-hooks/pre-commit git-hooks/pre-push

# Self-improving: make check times every step into
# ~/.local/state/dotfiles/gate-timings.jsonl (scripts/gate-timed.sh; not
# .metrics/, by accepted push back); the monthly speed review lives in
# /tooling-checkup (accepted push back: no second RECURRING.md); and
# docs/learnings.md logs predicted vs observed for each closed change.
map.self-improving: Makefile scripts/gate-timed.sh skills/tooling-checkup/SKILL.md docs/learnings.md

# Tool profile: CHANGELOG.md is generated from conventional commits by
# scripts/changelog.sh, a wrapper around git-cliff with cliff.toml
# (make changelog; the monthly checkup runs it because
# dotfiles has no release tags), and tests/changelog.bats regenerates it from
# its recorded commit to prove it was never edited by hand. LICENSE is MIT.
map.tool: CHANGELOG.md scripts/changelog.sh cliff.toml tests/changelog.bats LICENSE
