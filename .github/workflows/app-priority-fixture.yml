name: App priority fixture

on:
  pull_request:
    branches: [feat/chezmoi]
    paths:
      - bin/app-priority
      - bin/heavy-run
      - lib/stats.sh
      - lib/colors.sh
      - scripts/app-priority-synthetic-benchmark.py
      - scripts/app-priority-candidate.sh
      - scripts/app-priority-rust-fixture.rs
      - tests/app_priority_synthetic_benchmark_test.py
      - .github/workflows/app-priority-fixture.yml
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full reviewed baseline commit ID (leave both empty for harness check)
        required: false
        type: string
      candidate_sha:
        description: Full reviewed candidate commit ID (leave both empty for harness check)
        required: false
        type: string
      fixture_candidate:
        description: Use the reviewed fixture-only candidate from the candidate commit
        required: false
        type: boolean
        default: false
      rust_candidate:
        description: Use the reviewed fixture-only Rust candidate from the candidate commit
        required: false
        type: boolean
        default: false
      linux_preflight_only:
        description: Run only the hosted Linux negative-control preflight
        required: false
        type: boolean
        default: false
      native_probe:
        description: Measure the read-only native process selection probe
        required: false
        type: boolean
        default: false
      rust_command_check:
        description: Test and build the Rust priority command only
        required: false
        type: boolean
        default: false
      owned_comparison:
        description: Compare full commands on owned processes with mock actions
        required: false
        type: boolean
        default: false
      delivery_check:
        description: Test native installation and rollback
        required: false
        type: boolean
        default: false
      memory_comparison:
        description: Compare peak memory on owned processes
        required: false
        type: boolean
        default: false
      without_legacy:
        description: Remove the old priority rules from the scratch candidate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-priority-fixture-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  delivery-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_check }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: brew install bats-core jq
      - name: Test installation and rollback
        run: |
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run bats tests/app-priority-native.bats
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run bats -f 'README CLI reference|every task name' tests/dotfiles-actions.bats tests/telemetry.bats
      - name: Build, install and roll back in a scratch home
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$RUNNER_TEMP/priority-install-home"
          export XDG_DATA_HOME="$HOME/data"
          mkdir -p "$HOME"
          ./bin/app-priority-native install
          test -L "$XDG_DATA_HOME/dotfiles/native/app-priority/current"
          ./bin/app-priority-native rollback
          test ! -L "$XDG_DATA_HOME/dotfiles/native/app-priority/current"
  owned-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.owned_comparison || inputs.memory_comparison) }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare owned process decisions
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MEMORY_COMPARISON: ${{ inputs.memory_comparison }}
          WITHOUT_LEGACY: ${{ inputs.without_legacy }}
        run: |
          for sha in "$BASELINE_SHA" "$CANDIDATE_SHA"; do
            case "$sha" in ''|*[!0-9a-f]*) exit 2 ;; esac
            [ "${#sha}" -eq 40 ] || exit 2
            git cat-file -e "$sha^{commit}"
          done
          baseline="$RUNNER_TEMP/priority-owned-baseline"
          candidate="$RUNNER_TEMP/priority-owned-candidate"
          target="$RUNNER_TEMP/priority-owned-target"
          mkdir -p "$baseline" "$candidate"
          git archive "$BASELINE_SHA" | tar -x -C "$baseline"
          git archive "$CANDIDATE_SHA" | tar -x -C "$candidate"
          (cd "$candidate/rust" && "$GITHUB_WORKSPACE/bin/heavy-run" cargo build --locked --offline --release --features fixture-actions --target-dir "$target" --manifest-path app-priority/Cargo.toml)
          ./bin/heavy-run cargo build --locked --release --target-dir "$target" --manifest-path "$candidate/scripts/app-priority-native-probe/Cargo.toml"
          if [ -f "$candidate/bin/app-priority-native" ]; then
            extra=()
            if [ "$MEMORY_COMPARISON" = true ]; then extra+=(--memory); fi
            APP_PRIORITY_WITHOUT_LEGACY="$([ "$WITHOUT_LEGACY" = true ] && printf 1 || printf 0)" APP_PRIORITY_DELIVERY_BINARY="$target/release/dotfiles-app-priority" PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 "$candidate/scripts/app-priority-owned-benchmark.py" --base "$baseline" --candidate "$candidate" --child "$target/release/app-priority-native-probe" "${extra[@]}"
          else
            printf '#!/bin/bash\nexec "%s" --apply\n' "$target/release/dotfiles-app-priority" > "$candidate/bin/app-priority"
            PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/app-priority-owned-benchmark.py --base "$baseline" --candidate "$candidate" --child "$target/release/app-priority-native-probe"
          fi
  rust-command:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_command_check }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build Rust command
        run: |
          export CARGO_HOME="$RUNNER_TEMP/empty-cargo"
          mkdir -p "$CARGO_HOME"
          cd rust
          ../bin/heavy-run cargo test --locked --offline --manifest-path app-priority/Cargo.toml
          ../bin/heavy-run cargo build --locked --offline --release --manifest-path app-priority/Cargo.toml
          status=0
          app-priority/target/release/dotfiles-app-priority || status=$?
          [ "$status" -eq 2 ]
  native-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_probe }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build reviewed native probe
        run: PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run cargo build --locked --release --manifest-path scripts/app-priority-native-probe/Cargo.toml
      - name: Compare and measure controlled process selection
        run: PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive scripts/app-priority-native-probe/target/release/app-priority-native-probe --measure
  linux-fixture:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.native_probe && !inputs.rust_command_check && !inputs.owned_comparison && !inputs.delivery_check && !inputs.memory_comparison) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check mock-action fixture on Linux
        run: python3 -m unittest discover -s tests -p app_priority_synthetic_benchmark_test.py
      - name: Compile and check Rust fixture on Linux
        run: |
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run rustc --edition=2021 -O scripts/app-priority-rust-fixture.rs -o "$RUNNER_TEMP/app-priority-rust-fixture"
          APP_PRIORITY_RUST_FIXTURE_BINARY="$RUNNER_TEMP/app-priority-rust-fixture" python3 -m unittest discover -s tests -p app_priority_synthetic_benchmark_test.py
      - name: Run same-source comparison preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_sha != '' && inputs.baseline_sha == inputs.candidate_sha && !inputs.fixture_candidate }}
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          APP_PRIORITY_LINUX_PREFLIGHT: '1'
        run: |
          case "$BASELINE_SHA" in ''|*[!0-9a-f]*) echo 'Expected a full lowercase commit ID' >&2; exit 2 ;; esac
          [ "${#BASELINE_SHA}" -eq 40 ] || exit 2
          git cat-file -e "$BASELINE_SHA^{commit}"
          baseline="$RUNNER_TEMP/app-priority-linux-baseline"
          mkdir -p "$baseline"
          git archive "$BASELINE_SHA" | tar -x -C "$baseline"
          result="$(PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/app-priority-synthetic-benchmark.py --base "$baseline" --candidate "$baseline" --pairs 30)"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r["pairs"] == 30 and (r["ratio"] > 0.40 or r["candidate_median_ms"] > 400) else 1)'

      - name: Run candidate comparison preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_sha != '' && inputs.candidate_sha != '' && inputs.fixture_candidate }}
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          APP_PRIORITY_LINUX_PREFLIGHT: '1'
        run: |
          for sha in "$BASELINE_SHA" "$CANDIDATE_SHA"; do
            case "$sha" in ''|*[!0-9a-f]*) echo 'Expected full lowercase commit IDs' >&2; exit 2 ;; esac
            [ "${#sha}" -eq 40 ] || exit 2
            git cat-file -e "$sha^{commit}"
          done
          baseline="$RUNNER_TEMP/app-priority-linux-baseline"
          candidate="$RUNNER_TEMP/app-priority-linux-candidate"
          mkdir -p "$baseline" "$candidate"
          git archive "$BASELINE_SHA" | tar -x -C "$baseline"
          git archive "$CANDIDATE_SHA" | tar -x -C "$candidate"
          [ -f "$candidate/scripts/app-priority-candidate.sh" ] || exit 2
          cp "$candidate/scripts/app-priority-candidate.sh" "$candidate/bin/app-priority"
          result="$(PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/app-priority-synthetic-benchmark.py --base "$baseline" --candidate "$candidate" --pairs 30)"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r["pairs"] == 30 and 0 < r["ratio"] <= 0.40 and 0 < r["candidate_median_ms"] <= 400 else 1)'

  fixture:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.linux_preflight_only && !inputs.native_probe && !inputs.rust_command_check && !inputs.owned_comparison && !inputs.delivery_check && !inputs.memory_comparison) }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check fixture isolation and refusal logic
        run: python3 -m unittest discover -s tests -p app_priority_synthetic_benchmark_test.py
      - name: Compile and check Rust fixture on macOS
        run: |
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run rustc --edition=2021 -O scripts/app-priority-rust-fixture.rs -o "$RUNNER_TEMP/app-priority-rust-fixture"
          APP_PRIORITY_RUST_FIXTURE_BINARY="$RUNNER_TEMP/app-priority-rust-fixture" python3 -m unittest discover -s tests -p app_priority_synthetic_benchmark_test.py
      - name: Check one same-source fixture pair
        run: |
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/app-priority-synthetic-benchmark.py --base "$GITHUB_WORKSPACE" --candidate "$GITHUB_WORKSPACE" --pairs 1
      - name: Compare reviewed source trees
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.baseline_sha != '' || inputs.candidate_sha != '') }}
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FIXTURE_CANDIDATE: ${{ inputs.fixture_candidate }}
          RUST_CANDIDATE: ${{ inputs.rust_candidate }}
        run: |
          for sha in "$BASELINE_SHA" "$CANDIDATE_SHA"; do
            case "$sha" in ''|*[!0-9a-f]*) echo 'Expected full lowercase commit IDs' >&2; exit 2 ;; esac
            [ "${#sha}" -eq 40 ] || { echo 'Expected full lowercase commit IDs' >&2; exit 2; }
            git cat-file -e "$sha^{commit}"
          done
          baseline="$RUNNER_TEMP/app-priority-baseline"
          candidate="$RUNNER_TEMP/app-priority-candidate"
          mkdir -p "$baseline" "$candidate"
          git archive "$BASELINE_SHA" | tar -x -C "$baseline"
          git archive "$CANDIDATE_SHA" | tar -x -C "$candidate"
          if [ "$RUST_CANDIDATE" = true ]; then
            [ "$FIXTURE_CANDIDATE" != true ] || exit 2
            PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run rustc --edition=2021 -O "$candidate/scripts/app-priority-rust-fixture.rs" -o "$candidate/bin/app-priority-rust-fixture"
            printf '%s\n' '#!/bin/bash' 'exec "${0%/*}/app-priority-rust-fixture"' > "$candidate/bin/app-priority"
          elif [ "$FIXTURE_CANDIDATE" = true ]; then
            [ -f "$candidate/scripts/app-priority-candidate.sh" ] || exit 2
            cp "$candidate/scripts/app-priority-candidate.sh" "$candidate/bin/app-priority"
          fi
          result="$(PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/app-priority-synthetic-benchmark.py --base "$baseline" --candidate "$candidate" --pairs 30)"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r["pairs"] == 30 and 0 < r["ratio"] <= 0.40 and 0 < r["candidate_median_ms"] <= 400 else 1)'
