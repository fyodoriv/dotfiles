name: Brew Audit
on:
  schedule:
    - cron: '0 9 1 * *' # First day of each month at 9 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  audit-manifest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Homebrew metadata
        run: |
          brew update --quiet
          brew install jq

      - name: Audit Brewfile manifest entries
        id: audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          .github/scripts/brew-audit-manifest.sh .chezmoiscripts/run_onchange_brew.sh.tmpl

      - name: Create issue for Brewfile manifest problems
        if: steps.audit.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_LIST: ${{ steps.audit.outputs.list }}
        run: |
          body_file="$(mktemp)"
          {
            echo "## Monthly Brew Audit — $(date +%Y-%m-%d)"
            echo
            echo "The following Brewfile entries need attention:"
            echo
            printf '%s\n' "$AUDIT_LIST"
            echo
            echo "The audit checks Homebrew metadata and livecheck without requiring packages to be installed on the runner."
            echo
            echo "This issue is auto-generated by the brew-audit workflow."
          } > "$body_file"

          # Check if an open issue already exists
          existing=$(gh issue list --label "brew-audit" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create \
              --title "Brew audit: manifest problems ($(date +%Y-%m))" \
              --label "brew-audit" \
              --body-file "$body_file"
          fi

      - name: Summary
        env:
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
        run: |
          echo "## Brew Audit Results" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$AUDIT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
