name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-signer-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y bats jq yq
      - run: bats --filter 'shared signer fence' tests/plugin-v2.bats
