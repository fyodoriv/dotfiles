name: CI

# The hosted copy of the local gate. Standard GitHub-hosted runners are free
# for public repositories. See docs/ci-setup.md.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - The private-pattern leak gate cannot run here: its pattern file lives
#   only on the owner's machine. The local pre-push gate stays the authority.
# - Steps never print the environment.
# - macOS jobs are few on purpose: the free plan runs 5 at a time.

on:
  pull_request:
    branches: [feat/chezmoi]
  push:
    branches: [feat/chezmoi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTFILES_CI: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all scripts
        # lint-full: the cached `make lint` needs macOS `md5`.
        run: make lint-full
      - name: Validate TASKS.md
        run: make lint-tasks
      - name: Audit tasks-lint pin freshness
        run: make lint-tasks-freshness
        continue-on-error: true

  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate picks the tests a branch affects by comparing it with
          # origin/feat/chezmoi.
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        # bash: the git hooks and the coverage harness need Homebrew bash;
        # the runner has only /bin/bash 3.2. coreutils: tests call gtimeout.
        run: brew install bash coreutils shellcheck bats-core parallel chezmoi jq fd shfmt ripgrep
      - name: Restore the per-file gate cache
        # bin/cached-run skips a file whose inputs passed before, like nx.
        # A cache entry cannot be changed, so each run saves a new one and
        # restores the newest. A pull request reads its own entries and the
        # default branch's; it cannot write to the default branch's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cached-run
          key: cached-run-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cached-run-${{ runner.os }}-
      - name: Check the compare base of a push run
        # With a missing base (a recreated branch, a force push) the gate
        # would select no test and pass. Fail instead.
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
        run: git cat-file -e "${BASE}^{commit}"
      - name: Add the checkout timing tool to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/timing-tools"
          ln -s "$GITHUB_WORKSPACE/bin/heavy-run" "$RUNNER_TEMP/timing-tools/heavy-run"
          echo "$RUNNER_TEMP/timing-tools" >> "$GITHUB_PATH"
      - name: Verify timing queue is available
        run: test "$(command -v heavy-run)" = "$RUNNER_TEMP/timing-tools/heavy-run"
      - name: Gate (make check)
        env:
          # A push run compares with the commit before the push. Compared
          # with origin/feat/chezmoi (itself), it would select no test.
          BATS_AFFECTED_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/feat/chezmoi' }}
          # perf-gate.bats times 100 ms sleeps. On this runner they took up to
          # 241 ms, and other tests failed in each of 3 runs. It stays a local
          # test until TASKS.md perf-gate-hosted-runner-noise. make reads
          # this variable from the environment.
          TEST_SKIP_FILE: tests/perf-gate.bats
        run: make check
      - name: Full suite (manual runs only)
        # Fails today: TASKS.md full-suite-bats-argument-compatibility.
        if: github.event_name == 'workflow_dispatch'
        run: make test-all

  doctor:
    # Applies the whole config to the runner. Manual start only: a clean
    # runner has no chezmoi config yet (TASKS.md hosted-doctor-audit-clean-runner).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: brew install chezmoi jq fd
      - name: Deploy configs
        run: chezmoi apply --source "$PWD" --force
      - name: Run doctor
        run: ./bin/dotfiles-doctor --report
      - name: Shell startup benchmark
        run: |
          # Measure zsh startup time (interactive + login shell)
          # Runs 5 iterations and reports the median
          times=()
          for i in $(seq 1 5); do
            ms=$( { TIMEFORMAT='%3R'; time zsh -ic exit; } 2>&1 | tail -1 )
            # Convert seconds to milliseconds
            ms_int=$(echo "$ms * 1000" | bc | cut -d. -f1)
            times+=("$ms_int")
            echo "  Run $i: ${ms_int}ms"
          done
          # Sort and pick median (3rd of 5)
          IFS=$'\n' sorted=($(printf '%s\n' "${times[@]}" | sort -n)); unset IFS
          median=${sorted[2]}
          echo ""
          echo "Median shell startup: ${median}ms"
          echo "## Shell Startup Time" >> "$GITHUB_STEP_SUMMARY"
          echo "Median: **${median}ms** (threshold: 200ms)" >> "$GITHUB_STEP_SUMMARY"
          # Fail if median exceeds threshold (200ms for CI — runners are slower)
          threshold=200
          if [ "$median" -gt "$threshold" ]; then
            echo "::error::Shell startup ${median}ms exceeds ${threshold}ms threshold"
            exit 1
          fi
          echo "OK (under ${threshold}ms threshold)"

  audit:
    # Checks an installed machine, so it fails on a clean runner. Manual
    # start only (TASKS.md hosted-doctor-audit-clean-runner).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security audit
        run: ./bin/dotfiles-audit

  coverage:
    # Manual only: the traced full suite did not finish in 45 minutes on a
    # hosted runner. TASKS.md hosted-coverage-job-time.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fd-find python3
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          # Install bats from source (apt version is often outdated)
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: Run tests with coverage
        run: |
          # bin/dotfiles-coverage uses BASH_ENV + set -x to capture line
          # coverage portably (see lib/coverage-trap.sh and docs/ci-setup.md).
          # We replaced kcov because kcov 43 produced empty JSON on macOS Tahoe
          # local runs; the new harness works identically here and locally.
          ./bin/dotfiles-coverage run tests/
      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f coverage/bats/coverage.json ]; then
            pct=$(jq -r '.percent_covered' coverage/bats/coverage.json)
            floor=$(sed -n '1p' .shell-coverage-floor)
            echo "percent=$pct" >> "$GITHUB_OUTPUT"
            echo "## Shell Script Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Line coverage: **${pct}%**" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage floor: **${floor}%**" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            .github/scripts/check-shell-coverage.sh coverage/bats/coverage.json .shell-coverage-floor
          else
            echo "percent=unknown" >> "$GITHUB_OUTPUT"
            echo "## Shell Script Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not generated (dotfiles-coverage may have failed)" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not found"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-coverage
          path: coverage/
          retention-days: 14
