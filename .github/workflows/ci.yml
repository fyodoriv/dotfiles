name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-preflight-baseline:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install guard fixtures
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install bats-core jq shfmt
      - name: Classify inert branch metadata inputs
        run: ./bin/heavy-run bats tests/agent-hooks-git-branch-preflight.bats
