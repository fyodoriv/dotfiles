name: CI

# Tests run here, not on a dev Mac ("Lint local, tests on CI", 2026-11-16).
# Standard GitHub-hosted runners are free for public repositories; never use a
# larger (billed) runner. See docs/ci-setup.md.
#
# When what runs:
# - Pull request: lint, `make check` (the affected tests), audit.
# - Push to feat/chezmoi and nightly: the full suite (`make test-all`, not
#   `make check`), doctor, audit.
# - Weekly (Sunday): shell coverage, which traces the full suite (so the plain
#   full suite and doctor do not run again that day).
# - By hand (`gh workflow run ci.yml --ref <branch>`): everything.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - The private-pattern leak gate cannot run here: its pattern file lives
#   only on the owner's machine. The local pre-push gate stays the authority.
# - Steps never print the environment.
# - macOS jobs are few on purpose: the free plan runs 5 at a time.

on:
  pull_request:
    branches: [feat/chezmoi]
  push:
    branches: [feat/chezmoi]
  schedule:
    - cron: "31 6 * * *"   # nightly: full suite and doctor
    - cron: "53 6 * * 0"   # weekly: shell coverage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run has its own group (the cron line), so it never replaces a
  # pending push run of the same ref.
  group: ci-${{ github.event.pull_request.number || github.event.schedule || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTFILES_CI: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all scripts
        # lint-full: the cached `make lint` needs macOS `md5`.
        run: make lint-full
      - name: Validate TASKS.md
        run: make lint-tasks
      - name: Audit tasks-lint pin freshness
        run: make lint-tasks-freshness
        continue-on-error: true

  test:
    # Not on the weekly coverage cron: that run traces the full suite already.
    if: github.event.schedule != '53 6 * * 0'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate picks the tests a branch affects by comparing it with
          # origin/feat/chezmoi.
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        # bash: the git hooks and the coverage harness need Homebrew bash;
        # the runner has only /bin/bash 3.2. coreutils: tests call gtimeout.
        run: brew install bash coreutils shellcheck bats-core parallel chezmoi jq fd shfmt ripgrep git-cliff
      - name: Write the chezmoi config
        # `dotfiles managed` and a few other tests need a chezmoi config, as
        # on any installed machine. Default answers, no prompt.
        run: chezmoi init --source "$PWD" --no-tty --promptDefaults
      - name: Show test tool versions
        # Hosted-only test failures usually come from a different tool on
        # the runner. Print what the tests will find first on PATH.
        run: |
          for t in bash bats jq yq chezmoi git gh node npm git-cliff; do
            printf '%-10s %s: ' "$t" "$(command -v "$t" || echo missing)"
            "$t" --version 2>&1 | head -1 || true
          done
      - name: Restore the per-file gate cache
        # bin/cached-run skips a file whose inputs passed before, like nx.
        # A cache entry cannot be changed, so each run saves a new one and
        # restores the newest. A pull request reads its own entries and the
        # default branch's; it cannot write to the default branch's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cached-run
          key: cached-run-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cached-run-${{ runner.os }}-
      - name: Check the compare base of a push run
        # With a missing base (a recreated branch, a force push) the gate
        # would select no test and pass. Fail instead.
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
        run: git cat-file -e "${BASE}^{commit}"
      - name: Add the checkout timing tool to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/timing-tools"
          ln -s "$GITHUB_WORKSPACE/bin/heavy-run" "$RUNNER_TEMP/timing-tools/heavy-run"
          echo "$RUNNER_TEMP/timing-tools" >> "$GITHUB_PATH"
      - name: Verify timing queue is available
        run: test "$(command -v heavy-run)" = "$RUNNER_TEMP/timing-tools/heavy-run"
      - name: Check literal Perl alarms
        if: github.event_name == 'pull_request'
        run: bats tests/perl-alarm.bats
      - name: Gate (make check)
        # Pull requests only: the affected tests. Every other run starts the
        # full suite below, which covers them.
        if: github.event_name == 'pull_request'
        run: make check
      - name: Full suite (make test-all)
        if: github.event_name != 'pull_request'
        run: make test-all

  doctor:
    # Deploys the config files to a clean runner and runs the doctor. Pushes,
    # the nightly run and manual runs; not pull requests (it takes the second
    # macOS slot for minutes). Lifecycle scripts are left out: they install
    # packages and change macOS settings, which tests/e2e covers in a sandbox.
    if: github.event_name != 'pull_request' && github.event.schedule != '53 6 * * 0'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: brew install chezmoi jq fd
      - name: Write the chezmoi config
        run: chezmoi init --source "$PWD" --no-tty --promptDefaults
      - name: Deploy configs
        run: chezmoi apply --source "$PWD" --force --exclude=scripts
      - name: Run doctor
        # Only the modules whose checks the files-only apply can satisfy. The
        # others check an installed machine (git identity, gh login, brew
        # tools, LaunchAgents, power settings): 50 checks failed there on the
        # first runner, so `dotfiles doctor` on a real Mac covers them.
        run: |
          status=0
          for m in security ssh workflow agent-browser chezmoi chrome editor memory personal-machine plugins shell sync upgrade; do
            ./bin/dotfiles-doctor --report --module "$m" || status=1
          done
          exit "$status"
      - name: Shell startup benchmark
        run: |
          # Measure zsh startup time (interactive + login shell)
          # Runs 5 iterations and reports the median
          times=()
          for i in $(seq 1 5); do
            ms=$( { TIMEFORMAT='%3R'; time zsh -ic exit; } 2>&1 | tail -1 )
            # Convert seconds to milliseconds
            ms_int=$(echo "$ms * 1000" | bc | cut -d. -f1)
            times+=("$ms_int")
            echo "  Run $i: ${ms_int}ms"
          done
          # Sort and pick median (3rd of 5)
          IFS=$'\n' sorted=($(printf '%s\n' "${times[@]}" | sort -n)); unset IFS
          median=${sorted[2]}
          echo ""
          echo "Median shell startup: ${median}ms"
          echo "## Shell Startup Time" >> "$GITHUB_STEP_SUMMARY"
          echo "Median: **${median}ms** (threshold: 200ms)" >> "$GITHUB_STEP_SUMMARY"
          # Fail if median exceeds threshold (200ms for CI — runners are slower)
          threshold=200
          if [ "$median" -gt "$threshold" ]; then
            echo "::error::Shell startup ${median}ms exceeds ${threshold}ms threshold"
            exit 1
          fi
          echo "OK (under ${threshold}ms threshold)"

  audit:
    # The repo-content checks only (secrets in tracked files, tracked .env
    # files). The checks of an installed machine are skipped and shown. It runs
    # on Linux: it reads only tracked files, and a macOS slot was lost to
    # runner capacity three times on 2026-11-16.
    if: github.event.schedule != '53 6 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security audit
        env:
          DOTFILES_AUDIT_REPO_ONLY: "1"
        run: ./bin/dotfiles-audit

  coverage:
    # Weekly and by hand: the traced full suite (`--jobs 1`, set -x) is far
    # slower than the plain suite, so it stays off pull requests. The suite
    # targets macOS, so the job runs there with the same Homebrew tools as
    # `test` (the packaged Bats; no clone of bats-core).
    if: github.event.schedule == '53 6 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Some tests read pinned older commits, so the clone needs history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: brew install bash coreutils shellcheck bats-core parallel chezmoi jq fd shfmt ripgrep git-cliff
      - name: Write the chezmoi config
        run: chezmoi init --source "$PWD" --no-tty --promptDefaults
      - name: Run tests with coverage
        run: |
          # bin/dotfiles-coverage uses BASH_ENV + set -x to capture line
          # coverage portably (see lib/coverage-trap.sh and docs/ci-setup.md).
          # The `test` job gates test results. This job gates the coverage
          # floor, so a test that fails only under tracing is a warning here.
          ./bin/dotfiles-coverage run tests/ || echo "::warning::some tests failed under tracing; the test job gates test results"
      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f coverage/bats/coverage.json ]; then
            pct=$(jq -r '.percent_covered' coverage/bats/coverage.json)
            floor=$(sed -n '1p' .shell-coverage-floor)
            echo "percent=$pct" >> "$GITHUB_OUTPUT"
            echo "## Shell Script Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Line coverage: **${pct}%**" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage floor: **${floor}%**" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            .github/scripts/check-shell-coverage.sh coverage/bats/coverage.json .shell-coverage-floor
          else
            echo "percent=unknown" >> "$GITHUB_OUTPUT"
            echo "## Shell Script Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not generated (dotfiles-coverage may have failed)" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not found"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-coverage
          path: coverage/
          retention-days: 14
