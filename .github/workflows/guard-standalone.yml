name: Standalone Git guard suite

on:
  pull_request:
    branches: [feat/chezmoi]
    paths:
      - tests/agent-hooks-block-dangerous-git.bats
      - tests/fixtures/guard-*.sh.txt
      - tests/fixtures/guard-repo-query-timing.sh
      - agent-hooks/block-dangerous-git.sh
      - agent-hooks/plain-document-write.jq
      - agent-hooks/python-document-boundaries.py
      - .github/workflows/guard-standalone.yml

permissions:
  contents: read

jobs:
  standalone:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install guard test tools
        run: brew install bats-core jq shfmt
      - name: Run all standalone guard tests
        run: |
          status=0
          ./bin/heavy-run bats --tap tests/agent-hooks-block-dangerous-git.bats > "$RUNNER_TEMP/guard-standalone.tap" || status=$?
          cat "$RUNNER_TEMP/guard-standalone.tap"
          test "$status" -eq 0
          expected="$(grep -c '^@test ' tests/agent-hooks-block-dangerous-git.bats)"
          grep -qx "1\\.\\.$expected" "$RUNNER_TEMP/guard-standalone.tap"
