name: Scratch heavy-run deadline pause
on:
  push:
    branches: [probe/heavy-run-deadline-paused]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe elapsed deadline during a real queue pause
        run: python3 scripts/probe-heavy-run-deadline.py
