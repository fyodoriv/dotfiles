name: Native hook fixture

on:
  pull_request:
    branches: [feat/chezmoi]
    paths:
      - rust/hook-status/**
      - rust/vendor/**
      - scripts/hook-status-owned-benchmark.py
      - .github/workflows/hook-status-fixture.yml

permissions:
  contents: read

jobs:
  fixture:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install guard test tools
        run: brew install bats-core jq shfmt
      - name: Test the offline native guard candidate
        run: |
          export CARGO_HOME="$RUNNER_TEMP/empty-cargo"
          mkdir -p "$CARGO_HOME"
          cd rust
          ../bin/heavy-run cargo test --locked --offline --manifest-path hook-status/Cargo.toml
          ../bin/heavy-run cargo build --locked --offline --release --manifest-path hook-status/Cargo.toml
      - name: Compare guard decisions, timing, and memory
        run: PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/hook-status-owned-benchmark.py
      - name: Check the installed entry point and performance row
        run: |
          cp agent-hooks/block-dangerous-git.sh agent-hooks/block-dangerous-git-legacy.sh
          printf '#!/bin/bash\nexec "%s" "%s"\n' "$GITHUB_WORKSPACE/rust/hook-status/target/release/dotfiles-hook-status" "$GITHUB_WORKSPACE/agent-hooks/block-dangerous-git-legacy.sh" > agent-hooks/block-dangerous-git.sh
          # The source-specific plutil assertion belongs to the fallback now.
          python3 -c 'from pathlib import Path; p=Path("tests/agent-hooks-block-dangerous-git.bats"); s=p.read_text(); a="grep -q '\''/usr/bin/plutil'\'' agent-hooks/block-dangerous-git.sh"; assert s.count(a)==1; Path("tests/native-guard-fixture.bats").write_text(s.replace(a,a.replace("block-dangerous-git.sh","block-dangerous-git-legacy.sh")))'
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run bats tests/native-guard-fixture.bats
          HOOK_STATUS_INSTALLED=1 PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive python3 scripts/hook-status-owned-benchmark.py
          PATH="$GITHUB_WORKSPACE/bin:$PATH" heavy-run --exclusive scripts/perf-gate.sh --force --json > "$RUNNER_TEMP/hook-gate.json"
          jq '.commands[] | select(.name == "hook-block-dangerous-git")' "$RUNNER_TEMP/hook-gate.json"
          jq -e '.commands[] | select(.name == "hook-block-dangerous-git") | .ratio <= 0.50' "$RUNNER_TEMP/hook-gate.json"
