name: Migration inventory

on:
  pull_request:
    branches: [feat/chezmoi]
    paths:
      - rust/migration-inventory/**
      - .github/workflows/migration-inventory.yml

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pinned source offline
        run: |
          export CARGO_HOME="$RUNNER_TEMP/empty-cargo"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/inventory-target"
          mkdir -p "$CARGO_HOME"
          cd rust/migration-inventory
          ../../bin/heavy-run --exclusive python3 -c '
          import subprocess, time
          command = ["cargo", "build", "--locked", "--offline", "--release"]
          for label, limit in (("cold", 120), ("warm", 15)):
              start = time.monotonic()
              subprocess.run(command, check=True)
              elapsed = time.monotonic() - start
              print(f"{label}: {elapsed:.3f}s (limit {limit}s)", flush=True)
              if elapsed > limit:
                  raise SystemExit(f"{label} build exceeded budget")
          '
          ../../bin/heavy-run cargo test --locked --offline
