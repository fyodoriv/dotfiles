name: telemetry-gains-load-temp
# Temporary proof, never merge: the gains case 20 times while a full Bats
# run restarts in the background until a stop file exists.
on:
  pull_request:
    branches: [feat/chezmoi]
permissions:
  contents: read
env:
  DOTFILES_CI: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  load:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: brew install bash coreutils shellcheck bats-core parallel chezmoi jq fd shfmt ripgrep git-cliff
      - name: Gains case 20 times under a looping full Bats run
        run: |
          set +e
          rm -f "$RUNNER_TEMP/stop" "$RUNNER_TEMP/full.log"
          ( while [ ! -f "$RUNNER_TEMP/stop" ]; do
              echo "full start $(date -u +%T)" >>"$RUNNER_TEMP/full.log"
              bats -r tests >/dev/null 2>&1
              echo "full end rc=$? $(date -u +%T)" >>"$RUNNER_TEMP/full.log"
            done ) &
          sleep 30
          fail=0; low=0
          for i in $(seq 20); do
            load=$(uptime | sed 's/.*load averages*: *//' | cut -d' ' -f1 | tr -d ,)
            active=$(pgrep -f 'bats -r tests' | wc -l | tr -d ' ')
            echo "SAMPLE run=$i load1=$load full_bats_procs=$active"
            awk -v l="$load" 'BEGIN{exit !(l>4)}' || low=$((low+1))
            if bats tests/telemetry-gains.bats -f "takes over 5 seconds" >"$RUNNER_TEMP/out.$i" 2>&1; then echo "run $i pass"; else echo "run $i FAIL"; cat "$RUNNER_TEMP/out.$i"; fail=$((fail+1)); fi
          done
          touch "$RUNNER_TEMP/stop"
          echo "--- full-run log"; cat "$RUNNER_TEMP/full.log"
          echo "FAILURES=$fail LOW_LOAD_SAMPLES=$low"
          pkill -f 'bats -r tests' 2>/dev/null
          [ "$fail" -eq 0 ]
