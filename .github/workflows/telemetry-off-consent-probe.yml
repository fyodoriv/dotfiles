name: Telemetry off consent probe
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -qy bats jq
          bats --print-output-on-failure --filter 'status under an off policy' tests/telemetry-sink.bats
