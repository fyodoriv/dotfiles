# Agentfile.yaml — declarative AI agent configuration for this machine
# Bootstrap: agentbrew sync --agentfile ~/apps/dotfiles/Agentfile.yaml
# Lifecycle: dotfiles apply runs .chezmoiscripts/run_after_agentbrew-sync.sh,
# which syncs this file through agentbrew. Do not edit generated agent config
# under ~/.claude, ~/.config/devin, or other installed mirrors.
# See: https://www.npmjs.com/package/agentbrew

# Keep this manifest explicit. Hidden recommended sets can add optional MCP servers
# with required env vars and make unattended dotfiles sync fail noisy.

hooks:
  - event: PreToolUse
    matcher: Bash
    command: "~/.config/dotfiles/hooks/block-dangerous-git.sh"
  - event: PreToolUse
    matcher: Bash
    command: "~/.config/dotfiles/hooks/require-heavy-run.sh"
  - event: PreToolUse
    matcher: Shell
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
    agents: [claude-code]
  - event: PreToolUse
    matcher: Bash
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
  - event: PreToolUse
    matcher: Task
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
    agents: [claude-code]
  - event: SessionStart
    matcher: "*"
    command: "~/.config/dotfiles/hooks/session-endpoint-path.sh"
    agents: [claude-code]

# Default model for agents with a file-managed model setting (AGENTS.md §
# Model Configuration). Keep equal to the pin in
# .chezmoiscripts/run_after_claude-settings-model.sh. A machine that overrides
# that pin (chezmoi data claude_model/claude_effort) sets the same pair in its
# overlay Agentfile, so agentbrew and the pin agree.
defaultModel: claude-opus-5-5
defaultEffort: xhigh
# null keeps that agent's own model: Codex is OpenAI-only.
modelOverrides:
  codex: null

mcp:
  - playwright
  # Removed 2026-10-13 after a 180-day usage audit found 0 calls from Claude
  # Code or Codex on this Mac: context7, tasks-mcp, github (gh CLI is used),
  # figma (OAuth, unused), chrome-devtools (agent-browser is the browser
  # tool), shadcn-mcp (the shadcn skill stays). Each one started at session
  # start and was probed every 30 minutes. Re-add for every machine with
  # `agentbrew install <name>` and a line here. For one Mac only, list it in
  # the untracked ~/.config/dotfiles/Agentfile.local.yaml instead
  # (docs/agentbrew-setup.md). atlassian and jenkins stay out (see git history).
# Semantic memory runtime — AgentBrew owns daemon, MCP URL, and pack reconciliation.
memory:
  enabled: true
# Org-specific MCP servers (Google Drive, internal observability, etc.) live
# in the overlay Agentfile at ~/apps/<overlay>/Agentfile.yaml. The post-sync
# lifecycle script (.chezmoiscripts/run_after_agentbrew-sync.sh) automatically
# layers the overlay on top of this file when the overlay path is present.

