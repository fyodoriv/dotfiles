# Agentfile.yaml — declarative AI agent configuration for this machine
# Bootstrap: agentbrew sync --agentfile ~/apps/dotfiles/Agentfile.yaml
# Lifecycle: dotfiles apply runs .chezmoiscripts/run_after_agentbrew-sync.sh,
# which syncs this file through agentbrew. Do not edit generated agent config
# under ~/.claude, ~/.cursor, ~/.config/devin, or other installed mirrors.
# See: https://www.npmjs.com/package/agentbrew

# Keep this manifest explicit. Hidden recommended sets can add optional MCP servers
# with required env vars and make unattended dotfiles sync fail noisy.

hooks:
  - event: PreToolUse
    matcher: Bash
    command: "~/.config/dotfiles/hooks/block-dangerous-git.sh"
  - event: PreToolUse
    matcher: Shell
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
  - event: PreToolUse
    matcher: Bash
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
  - event: PreToolUse
    matcher: Task
    command: "~/.config/dotfiles/hooks/prepend-endpoint-path.sh"
  - event: SessionStart
    matcher: "*"
    command: "~/.config/dotfiles/hooks/session-endpoint-path.sh"

# Default model for agents with a file-managed model setting (AGENTS.md §
# Model Configuration). Keep equal to the pin in
# .chezmoiscripts/run_after_claude-settings-model.sh.
defaultModel: claude-opus-5-5
defaultEffort: medium
# null keeps that agent's own model: Codex is OpenAI-only and Devin has its
# own pin in modules/devin.
modelOverrides:
  codex: null
  devin: null

mcp:
  - context7
  - playwright
  - tasks-mcp
  # github: catalog @modelcontextprotocol/server-github, token from ${GITHUB_TOKEN}.
  - github
  # figma: official remote MCP (https://mcp.figma.com/mcp). Design context,
  # variables, components and code-connect mappings straight from a Figma file.
  # Per-client OAuth — the first tool call opens Figma's consent screen, so no
  # token lives here. Chosen over the desktop server (127.0.0.1:3845), which
  # only answers while the Figma app is open in Dev Mode on a paid Dev/Full seat.
  - figma
  # atlassian (uvx mcp-atlassian) removed from base — some orgs block OAuth MCP
  # plugins; use your team overlay for token-based jira-mcp instead. Re-add here
  # only for forks that want uvx mcp-atlassian with JIRA_* env vars directly.
  # jenkins removed permanently: the jenkins MCP needs JENKINS_URL/USER/
  # API_TOKEN, but the Jenkins API token is not obtainable here. Jenkins
  # access is browser-only — use the jenkins-troubleshooting skill
  # (persistent agent-browser dashboard), not an MCP. Do not re-add.
  # chrome-devtools-mcp: Google ChromeDevTools team's official MCP.
  # Gives agents Lighthouse, performance traces, accessibility audits, live
  # DOM, console errors, and network logs in-loop — closes the "design that
  # performs" gap (Core Web Vitals + a11y) that screenshot-only tools miss.
  # No API key. Free. https://github.com/ChromeDevTools/chrome-devtools-mcp
  - name: chrome-devtools
    command: npx
    args:
      - "-y"
      - chrome-devtools-mcp@latest
  # shadcn-mcp (CLI 3.0, zero-config since Aug 2025; May 2026 added registry
  # include + validate): lets agents browse, search, view, and install
  # components from any shadcn-compatible registry via natural language.
  # Works across namespaced registries — no per-project components.json
  # required upfront. https://ui.shadcn.com/docs/registry/mcp
  - name: shadcn-mcp
    command: npx
    args:
      - "-y"
      - shadcn@latest
      - mcp
# Semantic memory runtime — AgentBrew owns daemon, MCP URL, and pack reconciliation.
memory:
  enabled: true
# Org-specific MCP servers (Google Drive, internal observability, etc.) live
# in the overlay Agentfile at ~/apps/<overlay>/Agentfile.yaml. The post-sync
# lifecycle script (.chezmoiscripts/run_after_agentbrew-sync.sh) automatically
# layers the overlay on top of this file when the overlay path is present.

