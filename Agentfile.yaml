rules: |
  Keep TASKS.md in tasks.md format and remove completed task blocks entirely.
  Agentfile.yaml is the source; generated agent config is owned by agentbrew.
  No completion claims without fresh verification evidence.
  At session start, when the memory MCP is available, call get_bootstrap_profile with this agent's ID and current task_summary, then search ranked memory and mistake notes before consequential decisions.
  Before answering questions about local repositories, architecture, configuration, operations, or domain workflows, automatically search memory with the task and relevant repo/topic tags. Prefer current-revision repo-procedure and pattern memories over generic repo-docs dossiers; if grounded memory is missing or stale, read the current source docs, answer from them, and store the reusable correction with source paths and revision.
  Before the final response after substantive work, call commit_session_legacy once; encode decisions as {what, why}, errors as {error, tool, resolution}, and user corrections as {original, corrected_to}.
  Store only reusable context under project/topic/agent tags; never secrets, credentials, raw transcripts, or transient logs.
  Never put live authentication material or customer payload snapshots in tests,
  logs, screenshots, pull request descriptions, or committed files. Use safe
  placeholders and fixtures instead.
  Name the lifecycle scope of mutable state in code, documentation, and pull
  requests. Use a precise name such as module, provider-instance, Redux-store,
  browser-page, or `globalThis` registry scope.
  Do not use unqualified terms such as `globalState`, "global state", or
  `singleton`. Name the state owner and lifecycle scope.
  Access `globalThis` or `Symbol.for` in one named owner module only. Document
  its lifecycle, cleanup, and deletion condition in that module.
  Every PR needs uncommitted visual proof: use a browser screenshot for UI work
  and a pasted terminal transcript for non-UI work, name the covered case and
  result, and never commit the image. A transcript is copyable and diffable, so
  it beats a picture of the same text; a terminal image is an equal alternative,
  never a requirement. Drag and drop any image into the PR description.
  Never drive AppleScript, keystrokes, or window activation to stage a terminal
  image; that steals focus and can type into whatever is frontmost.
  Approved-family /ship-it delivery and org-overlay IRON LAW: see shared-rules.md sections "Git and delivery" and "Org-overlay routing" (full text in ship-it command + templates/AGENTS.md).
  Broad sibling delivery remains limited to approved repo families.
  Within those families, never bypass-merge someone else's PR.
