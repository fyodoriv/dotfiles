# Merged into the canonical agentbrew Agentfile only when owner_machine is
# true (chezmoi data, or DOTFILES_OWNER_MACHINE). These rules are the repo
# owner's personal workflow, so a new user's agents never load them. agentbrew
# appends them after the general rules in Agentfile.yaml.
# See .chezmoiscripts/run_after_agentbrew-sync.sh.
rules: |
  Right before the Needed-from-you line, add two lines, in this order.
  First, suggested next work that nobody has started:
  "**Follow-ups:** <suggestion>; <suggestion>". Put known follow-ups here:
  out-of-scope findings, tasks worth filing, cleanup or steps left undone
  (with why they wait). Give each a few words and why it matters.
  If there are none, write "**Follow-ups:** nothing".
  Second, what is in flight right now:
  "**Waiting on:** <item> (<what it waits for>; check: <which check>;
  next: <HH:MM TZ>); <item>". List only
  work that is running or queued now and will change state without a new
  request from me: running CI, background jobs, queued heavy-run checks,
  linked chats or sessions that are still working, and unfinished steps of
  this task that are blocked on one of those. Never list a follow-up here.
  Each item names the exact check that watches it (for example background
  job bzdl5bv87 running `timeout 1500 gh run watch <run-id>`, a
  ScheduleWakeup id, a Monitor, or a CI check name) and the deadline by
  which that check reports back to this session, as a local clock time
  (for example "next: 23:41 EST" or "polls every 60 s; next: 23:41 EST").
  The deadline is the watcher's own hard timeout or wake time, so the
  session wakes by then even when nothing changed; never give the time of
  one poll, which goes stale within a minute. An item with no watching
  check is not allowed: start a watcher with a timeout, or move the item
  out of Waiting on. When the deadline passes, report the item's state and
  re-arm the watcher with a new deadline.
  Explain the watcher in plain words, not only its command: what it
  checks, how often, what makes it report early, and what happens at the
  deadline. Example: "PR 831 CI (re-run on 52712981; check: background
  job b95ko4144 asks GitHub every 60 s and wakes me as soon as all checks
  pass or one fails; next: 19:29 EST, when it gives up and wakes me even
  if CI is still running, and I report and re-arm)".
  Check each item live before listing it. Never list one from memory.
  If a live check is unavailable, state that verification is pending and the
  current status is unknown. Do not infer "nothing" from an unavailable check.
  If nothing is in flight, write "**Waiting on:** nothing".
  The lines are independent: needing no user action does not mean nothing is
  in flight, and nothing in flight does not mean there are no follow-ups.
  End every message with one last line that says exactly what you need from me,
  as a one-liner: "**Needed from you:** <action or exact command>". If you need
  nothing, write "**Needed from you:** nothing". Never put the request only
  mid-message.
  Before the Needed-from-you line asks for anything, an independent judge
  subagent checks the ask against live evidence: the thing exists and was
  checked live (not from memory), it is still needed, and I have not done it
  already. The judge also checks full context. It rejects an ask that names
  a term, file, flag, hook, step, or internal name without explaining it in
  plain words: what it is, why it needs me, each option and what it changes
  for me, and where to do it.
  Link the exact item or the place to act. Recommend one option and give
  the reason. If only one action is possible, say what happens if I leave
  it pending. The judge rejects an ask that lacks the link or a reason for
  its recommendation.
  Write the ask only after the judge approves; otherwise write
  "**Needed from you:** nothing" or the corrected ask.
  When Waiting on lists anything, the same judge also checks both lines against live
  evidence: each Waiting-on item is still running or queued (a finished job,
  a merged PR or an idle session is not), and no follow-up sits under
  Waiting on. It rejects a Waiting-on item that lacks its check or its next
  time, or whose next time is already in the past. Fix the lines before you
  send.
  At session start, when the memory MCP is available, call get_bootstrap_profile with this agent's ID and current task_summary, then search ranked memory and mistake notes before consequential decisions.
  Before answering questions about local repositories, architecture, configuration, operations, or domain workflows, automatically search memory with the task and relevant repo/topic tags. Prefer current-revision repo-procedure and pattern memories over generic repo-docs dossiers; if grounded memory is missing or stale, read the current source docs, answer from them, and store the reusable correction with source paths and revision.
  Before the final response after substantive work, when the memory MCP is available, call commit_session_legacy once; encode decisions as {what, why}, errors as {error, tool, resolution}, and user corrections as {original, corrected_to}.
  Store only reusable context under project/topic/agent tags; never secrets, credentials, raw transcripts, or transient logs.
  Approved-family /ship-it delivery and org-overlay IRON LAW: see shared-rules.md sections "Git and delivery" and "Org-overlay routing" (full text in ship-it command + templates/AGENTS.md).
  Broad sibling delivery remains limited to approved repo families.
  Within those families, never bypass-merge someone else's PR.
  Windsurf and Devin support was removed on 2026-10-08. Augment (Auggie) is deprecated and frozen in all tooling repos: keep its existing support, but never implement fixes or features for it, never file tasks for it, and ignore its failing checks.
  Every app or tool I build to share ships an upstream feedback loop: a
  CONTRIBUTING.md "Report problems and ideas" section (my welcome, the
  `agentbrew report` safety steps, the opt-out), a one-line pointer to it in
  AGENTS.md, and the `report-upstream` skill in its Agentfile. The
  new-project scorer checks this; scaffold it from new-project.
  When the queue is empty or I ask to keep going, run `/loop /watch-issues ~/apps/tooling/agentbrew ~/apps/tooling/dotfiles`
  (add ~/apps/careerbrew only when I ask): each pass fixes new issues, unblocked tasks, and red PRs right away.
