# ── Starship Prompt — Dracula Theme ──────────────────────────────────
# Docs: https://starship.rs/config/

# scan_timeout: abort directory scan after 500ms (default 30ms is too tight on large monorepos)
# command_timeout: abort any slow module command to keep prompt snappy
# fnm multishell shims can take >500ms on first invocation, so allow 2s
scan_timeout = 500
command_timeout = 2000

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$java\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

# ── Character ────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

# ── Directory ────────────────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 🔒"

# ── Git Branch ───────────────────────────────────────────────────────
[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "
style = "bold purple"
truncation_length = 30

# ── Git Status ───────────────────────────────────────────────────────
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = " =${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?${count}"
stashed = " 📦${count}"
modified = " !${count}"
staged = " +${count}"
deleted = " ✘${count}"

# ── Git State (rebase, merge, etc.) ──────────────────────────────────
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ── Node.js ──────────────────────────────────────────────────────────
[nodejs]
format = " [$symbol($version)]($style)"
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

# ── Python ───────────────────────────────────────────────────────────
[python]
format = " [$symbol($version)]($style)"
symbol = " "
style = "bold yellow"

# ── Java ─────────────────────────────────────────────────────────────
[java]
format = " [$symbol($version)]($style)"
symbol = " "
style = "bold red"

# ── Docker ───────────────────────────────────────────────────────────
[docker_context]
format = " [$symbol$context]($style)"
symbol = " "
style = "bold blue"
only_with_files = true

# ── Kubernetes ───────────────────────────────────────────────────────
[kubernetes]
format = " [$symbol$context(:$namespace)]($style)"
symbol = "⛵ "
style = "bold blue"
disabled = true

# ── Command Duration (show if >3s) ───────────────────────────────────
[cmd_duration]
min_time = 3_000
format = " [$duration]($style)"
style = "bold yellow"

# ── Disabled modules (keep prompt fast) ──────────────────────────────
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[package]
disabled = true
