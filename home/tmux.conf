# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,ghostty:Tc"
set -g mouse on
set -g history-limit 100000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0
setw -g aggressive-resize on

# ── Orchestrator pipeline notifications ────────────────────────────
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style "fg=#50fa7b,bold,reverse"

# ── Prefix ───────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Window & pane management ─────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload config ────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Status bar ───────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#44475a,fg=#f8f8f2"
# Show session name on left; active pane's running command + window count on right
set -g status-left "#[fg=#50fa7b,bold] #S #[fg=#6272a4]│ "
set -g status-right "#[fg=#6272a4]#{pane_current_command} #[fg=#bd93f9] %H:%M "
set -g status-left-length 30
set -g status-right-length 40

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ff79c6,bold] #I:#W "

# Automatic window rename — shows current command in tab (e.g. "devin", "vim", "node")
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# Show pane numbers briefly when navigating (helps in fleet sessions with many panes)
set -g display-panes-time 2000

# ── Copy mode (vi) ──────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Window numbering ────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
