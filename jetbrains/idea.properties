# custom WebStorm properties (expand/override 'bin/idea.properties')

ide.browser.jcef.out-of-process.enabled=false

# Increase file watching limit for large monorepos
idea.filewatcher.disabled=false
idea.max.intellisense.filesize=5000

# Increase max content load size
idea.max.content.load.filesize=20000

# Increase max recent files
ide.max.recent.files.count=50

# TypeScript service memory — default 512MB is too low for large TS monorepos
# minsky orchestrator has ~30 source files + shared types across workspaces
typescript.service.memoryLimit=4096

# Editor performance
editor.zero.latency.typing=true

# Skip syntax highlighting on files larger than 2MB — prevents parser hangs on generated/large files
idea.max.highlight.filesize=2000

# Don't block on git index changes — reduces startup / branch-switch lag
git.wait.for.changed.files.indexing=false
